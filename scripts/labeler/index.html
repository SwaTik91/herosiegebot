<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hero Siege — разметка</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1c1410;
      --panel: #2a2118;
      --paper: #d7c4a3;
      --brass: #d4a017;
      --blood: #c43c2c;
      --line: #5a4a38;
      --muted: #9a8770;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--ink); color: var(--paper); font-family: "Source Serif 4", serif; }
    body { display: grid; grid-template-columns: 1fr 280px; min-height: 100%; }
    main { display: grid; grid-template-rows: auto 1fr auto; min-width: 0; }
    header, footer, aside { padding: 14px 18px; }
    header, footer { background: #221a14; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 16px; }
    footer { border-bottom: 0; border-top: 1px solid var(--line); justify-content: space-between; }
    h1 { margin: 0; font-size: 22px; letter-spacing: 0.02em; }
    .meta, .hint, button, .cls, .box { font-family: "IBM Plex Mono", monospace; }
    .meta { color: var(--brass); font-size: 13px; }
    .hint { color: var(--muted); font-size: 12px; }
    #stage { overflow: auto; display: grid; place-items: center; padding: 16px; background: #120e0b; }
    canvas { max-width: 100%; max-height: calc(100vh - 132px); width: auto; height: auto; cursor: crosshair; background: #000; box-shadow: 0 0 0 1px #3d2f22; }
    aside { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
    .cls { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 8px; border: 1px solid var(--line); background: #1d1611; color: var(--paper); text-align: left; cursor: pointer; }
    .cls.active { border-color: var(--brass); background: #3a2c18; }
    .swatch { width: 12px; height: 12px; flex: 0 0 12px; }
    button.nav { background: #3a2c18; color: var(--paper); border: 1px solid var(--brass); padding: 6px 12px; cursor: pointer; }
    #boxes { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; }
    #boxes li { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #3d2f22; cursor: pointer; font-size: 12px; }
    #boxes li.sel { color: var(--brass); }
    .status.ok { color: #8fbf6a; }
    .status.dirty { color: var(--blood); }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Полевая тетрадь</h1>
      <span class="meta" id="title">загрузка</span>
      <span class="hint">1–8 класс · мышь рамка · Del удалить · ← → кадр</span>
    </header>
    <div id="stage"><canvas id="cv"></canvas></div>
    <footer>
      <div>
        <button class="nav" id="prev" type="button">← prev</button>
        <button class="nav" id="next" type="button">next →</button>
      </div>
      <span class="meta status" id="status">—</span>
    </footer>
  </main>
  <aside>
    <div id="classes"></div>
    <ul id="boxes"></ul>
  </aside>
  <script>
    const COLORS = ["#3dff4a", "#4aa3ff", "#ff3b3b", "#ffe14a", "#3de0ff", "#c46bff", "#ff4ad2", "#fff27a"];
    const state = { images: [], classes: [], index: 0, boxes: [], cls: 2, selected: -1, drag: null, img: null, dirty: false };

    const cv = document.getElementById("cv");
    const ctx = cv.getContext("2d");

    const toCanvas = (box) => ({
      x: (box.x - box.w / 2) * cv.width,
      y: (box.y - box.h / 2) * cv.height,
      w: box.w * cv.width,
      h: box.h * cv.height,
    });

    const fromCanvas = (x, y, w, h) => {
      const nx = Math.min(x, x + w);
      const ny = Math.min(y, y + h);
      const nw = Math.abs(w);
      const nh = Math.abs(h);
      const clamp = (value) => Math.min(1, Math.max(0, value));
      return {
        cls: state.cls,
        x: clamp((nx + nw / 2) / cv.width),
        y: clamp((ny + nh / 2) / cv.height),
        w: clamp(nw / cv.width),
        h: clamp(nh / cv.height),
      };
    };

    function draw() {
      ctx.clearRect(0, 0, cv.width, cv.height);
      if (state.img) ctx.drawImage(state.img, 0, 0);
      state.boxes.forEach((box, i) => {
        const r = toCanvas(box);
        ctx.strokeStyle = COLORS[box.cls % COLORS.length];
        ctx.lineWidth = i === state.selected ? 3 : 2;
        ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w, r.h);
        ctx.fillStyle = COLORS[box.cls % COLORS.length];
        ctx.font = "14px IBM Plex Mono";
        ctx.fillText(state.classes[box.cls] || String(box.cls), r.x + 4, r.y + 16);
      });
    }

    function renderSidebar() {
      document.getElementById("classes").innerHTML = state.classes.map((name, i) => `
        <button class="cls ${i === state.cls ? "active" : ""}" data-cls="${i}" type="button">
          <span class="swatch" style="background:${COLORS[i % COLORS.length]}"></span>
          ${i + 1} ${name}
        </button>`).join("");
      document.getElementById("boxes").innerHTML = state.boxes.map((box, i) => `
        <li class="${i === state.selected ? "sel" : ""}" data-i="${i}">
          <span>${state.classes[box.cls]}</span><span>${Math.round(box.w * 100)}×${Math.round(box.h * 100)}</span>
        </li>`).join("");
    }

    function setStatus(ok) {
      const el = document.getElementById("status");
      el.textContent = ok ? "сохранено" : "не сохранено";
      el.className = "meta status " + (ok ? "ok" : "dirty");
    }

    async function save() {
      const name = state.images[state.index];
      if (!name) return;
      await fetch("/api/label/" + name, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ boxes: state.boxes }),
      });
      state.dirty = false;
      setStatus(true);
    }

    async function load(index) {
      if (state.dirty) await save();
      state.index = (index + state.images.length) % state.images.length;
      const name = state.images[state.index];
      document.getElementById("title").textContent = `${name}  ${state.index + 1} / ${state.images.length}`;
      const img = new Image();
      const label = await (await fetch("/api/label/" + name)).json();
      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = reject;
        img.src = "/images/" + name;
      });
      state.img = img;
      cv.width = img.naturalWidth;
      cv.height = img.naturalHeight;
      state.boxes = label.boxes || [];
      state.selected = -1;
      state.dirty = false;
      setStatus(true);
      draw();
      renderSidebar();
    }

    function hit(mx, my) {
      for (let i = state.boxes.length - 1; i >= 0; i -= 1) {
        const r = toCanvas(state.boxes[i]);
        if (mx >= r.x && my >= r.y && mx <= r.x + r.w && my <= r.y + r.h) return i;
      }
      return -1;
    }

    function canvasPos(event) {
      const rect = cv.getBoundingClientRect();
      const scaleX = cv.width / rect.width;
      const scaleY = cv.height / rect.height;
      return [(event.clientX - rect.left) * scaleX, (event.clientY - rect.top) * scaleY];
    }

    cv.addEventListener("mousedown", (event) => {
      const [x, y] = canvasPos(event);
      const i = hit(x, y);
      if (i >= 0) {
        state.selected = i;
        state.cls = state.boxes[i].cls;
        state.drag = { mode: "move", i, x, y, box: { ...state.boxes[i] } };
      } else {
        state.selected = -1;
        state.drag = { mode: "draw", x, y };
        state.boxes.push(fromCanvas(x, y, 1, 1));
        state.selected = state.boxes.length - 1;
      }
      draw();
      renderSidebar();
    });

    cv.addEventListener("mousemove", (event) => {
      if (!state.drag) return;
      const [x, y] = canvasPos(event);
      if (state.drag.mode === "draw") {
        state.boxes[state.selected] = fromCanvas(state.drag.x, state.drag.y, x - state.drag.x, y - state.drag.y);
      } else {
        const dx = (x - state.drag.x) / cv.width;
        const dy = (y - state.drag.y) / cv.height;
        const box = state.drag.box;
        state.boxes[state.drag.i] = { ...box, x: box.x + dx, y: box.y + dy };
      }
      draw();
    });

    window.addEventListener("mouseup", () => {
      if (!state.drag) return;
      const box = state.boxes[state.selected];
      if (box && (box.w < 0.008 || box.h < 0.008)) state.boxes.splice(state.selected, 1);
      state.drag = null;
      state.dirty = true;
      setStatus(false);
      draw();
      renderSidebar();
      save();
    });

    document.getElementById("classes").addEventListener("click", (event) => {
      const btn = event.target.closest("[data-cls]");
      if (!btn) return;
      state.cls = Number(btn.dataset.cls);
      if (state.selected >= 0) {
        state.boxes[state.selected].cls = state.cls;
        state.dirty = true;
        save();
      }
      renderSidebar();
      draw();
    });

    document.getElementById("boxes").addEventListener("click", (event) => {
      const row = event.target.closest("[data-i]");
      if (!row) return;
      state.selected = Number(row.dataset.i);
      state.cls = state.boxes[state.selected].cls;
      draw();
      renderSidebar();
    });

    document.getElementById("prev").onclick = () => load(state.index - 1);
    document.getElementById("next").onclick = () => load(state.index + 1);

    window.addEventListener("keydown", (event) => {
      if (["ArrowLeft", "ArrowRight", "Backspace", "Delete"].includes(event.key)) {
        event.preventDefault();
      }
      if (event.key >= "1" && event.key <= "8") {
        const cls = Number(event.key) - 1;
        if (cls < state.classes.length) {
          state.cls = cls;
          if (state.selected >= 0) {
            state.boxes[state.selected].cls = cls;
            save();
          }
          renderSidebar();
          draw();
        }
      } else if (event.key === "Delete" || event.key === "Backspace") {
        if (state.selected >= 0) {
          state.boxes.splice(state.selected, 1);
          state.selected = -1;
          save();
          draw();
          renderSidebar();
        }
      } else if (event.key === "ArrowRight" || event.key === "d") load(state.index + 1);
      else if (event.key === "ArrowLeft" || event.key === "a") load(state.index - 1);
      else if (event.key === "s") save();
    });

    (async () => {
      const meta = await (await fetch("/api/meta")).json();
      state.classes = meta.classes;
      state.images = meta.images;
      state.cls = Math.max(0, state.classes.indexOf("enemy"));
      renderSidebar();
      if (state.images.length) await load(0);
    })();
  </script>
</body>
</html>
