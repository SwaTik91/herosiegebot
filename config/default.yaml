window:
  title: Hero Siege

controls:
  movement:
    up: W
    left: A
    down: S
    right: D
  skills: [Q, E]
  potions: ["1", "2"]
  emergency_stop: CTRL+SHIFT+F10

calibration:
  confidence_threshold: 0.9
  min_stable_frames: 3
  min_scale: 0.5
  max_scale: 2.0
  scale_step: 0.05

survival:
  health_threshold: 0.35
  resource_threshold: 0.25
  potion_cooldown_s: 1.0

combat:
  detection_confidence: 0.7
  attack_hold_s: 0.25
  skill_cooldowns_s:
    Q: 5.0
    E: 8.0
  combat_timeout_s: 10.0
  loot_timeout_s: 3.0

detectors:
  template_confidence: 0.8
  nms_iou_threshold: 0.3
  motion_threshold: 25
  min_candidate_area: 12
  bar_min_border_confidence: 0.7
  health_fill_hsv_lower: [0, 120, 100]
  health_fill_hsv_upper: [10, 255, 255]
  resource_fill_hsv_lower: [105, 120, 100]
  resource_fill_hsv_upper: [130, 255, 255]
  bar_border_hsv_lower: [0, 0, 180]
  bar_border_hsv_upper: [179, 80, 255]
  player_marker_hsv_lower: [80, 120, 120]
  player_marker_hsv_upper: [100, 255, 255]
  player_marker_min_area: 4

exploration:
  movement_pulse_s: 0.15
  max_movement_pulse_s: 0.3
  stuck_timeout_s: 1.5
  fog_hsv_lower: [0, 0, 0]
  fog_hsv_upper: [179, 255, 28]
  explored_hsv_lower: [0, 0, 28]
  explored_hsv_upper: [179, 255, 255]
  morphology_kernel_size: 3
  morphology_iterations: 1
  frontier_reveal_radius: 4
  frontier_path_weight: 1.0
  frontier_reveal_weight: 1.0
  frontier_failure_penalty: 100.0
  frontier_blacklist_radius: 0.08
  progress_min_distance: 0.01
  progress_min_reveal_pixels: 2
  no_progress_sample_limit: 3

recording:
  enabled: true
  overlay: true
  frame_interval_s: 1.0
  live_overlay: true

yolo:
  enabled: true
  observe_only: true
  weights: models/hero-siege-yolo11n-user-v1.pt
  confidence: 0.35
  imgsz: 1280
  device: auto
