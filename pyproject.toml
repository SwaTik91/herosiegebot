[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hero-siege-bot"
version = "0.1.0a1"
description = "Vision-driven Hero Siege farming bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "opencv-python",
    "PyYAML",
    "dxcam; sys_platform == 'win32'",
    "pywin32; sys_platform == 'win32'",
]

[project.scripts]
hero-siege-bot = "hero_siege_bot.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hero_siege_bot = ["assets/**/*.png"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
