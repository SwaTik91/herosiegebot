[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hero-siege-bot"
version = "0.1.0"
description = "Vision-driven Hero Siege farming bot"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "opencv-python",
    "PyYAML",
    "dxcam; sys_platform == 'win32'",
    "pywin32; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
